# One hostname per line. `#` starts a comment.
#
# The container re-reads this file on every update cycle (300s), so adding or
# removing a hostname here never needs a restart.
#
# Optional per-record overrides: `type=A|AAAA` and `proxied=true|false`.
# Defaults come from .env (CF_RECORD_TYPE, CF_PROXIED).

app1.example.com
app2.example.com            proxied=false
ipv6.example.com  type=AAAA proxied=false
